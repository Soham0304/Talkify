version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: talkify-postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - talkify-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: talkify-backend
    depends_on:
      - postgres
    ports:
      - "8080:8080"
    env_file:
      - .env
    networks:
      - talkify-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: talkify-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - talkify-network

volumes:
  postgres_data:

networks:
  talkify-network:
    driver: bridge
